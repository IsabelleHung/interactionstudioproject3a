<!DOCTYPE html>
<html>

<head>
    <title>Find Your Seat</title>
    <link rel="stylesheet" href="styles.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <div class="header">
        <div class="header-top">
            <img src="assets/parsons_header.svg" alt="Parsons Logo">
        </div>
        <div class="header-bottom">
            <p><a href="index.html">Find Your Seat</a></p>
        </div>
    </div>


    <div class="booking-container">
    
        <div class="booking">
            <img src="assets/img1.jpg" width="350">
            <h3 class="building buildingbook">Alvin Johnson/J.M. Kaplan Hall</h3>
            <p class="location">66 W 12th St</p>
            <p class="capacity">Capacity 28</p>
            <p class="hours">2 Hours</p>
            <div class="char-list">
                <span class="char">Stool Seating<img src="assets/char2.png" alt="checked"></span>
                <span class="char">Group Activities<img src="assets/char2.png" alt="checked"></span>
            </div>
        </div>


        <form class="info">
            <label for="fname">Full Name</label>
            <input type="text" id="fname" name="fname"><br><br>
            <label for="email">Email</label>
            <input type="text" id="email" name="email"><br><br>
            <!-- <input type="submit" value="Book Now" class="button1 bookingbutton"> -->
            <button class="button1 bookingbutton"type="submit"><a href="success.html">Book</a></button>
        </form>
    </div>


    <script src="script.js"></script>

</body>

</html>
